name: Push to Meta

on:
  schedule:
    # Every 15 minutes, Mon-Fri, 07:00-19:59 UTC (fits the 2,000 free minutes/month of a
    # private repo). GitHub can start scheduled runs a few minutes late.
    - cron: "*/15 7-19 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: "check setup"
        options:
          - "check setup"
          - "dry run"
          - "push to Meta"
      task_id:
        description: "ClickUp task ID (empty = every task in Push to Facebook). Not used by 'check setup'."
        required: false

# Never run two uploads at once (stops duplicate ads).
concurrency:
  group: push-to-meta
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
      CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}
      CLICKUP_LIST_IDS: ${{ secrets.CLICKUP_LIST_IDS }}
      CLICKUP_TRIGGER_STATUS: ${{ vars.CLICKUP_TRIGGER_STATUS }}
      CLICKUP_DONE_STATUS: ${{ vars.CLICKUP_DONE_STATUS }}
      CLICKUP_FAILED_STATUS: ${{ vars.CLICKUP_FAILED_STATUS }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_INSTAGRAM_USER_ID: ${{ secrets.META_INSTAGRAM_USER_ID }}
      META_TEMPLATE_ADSET_ID: ${{ secrets.META_TEMPLATE_ADSET_ID }}
      META_AD_STATUS: ${{ vars.META_AD_STATUS }}
      META_URL_TAGS: ${{ vars.META_URL_TAGS }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      ACTION: ${{ inputs.action || 'push to Meta' }}
      TASK_ID: ${{ inputs.task_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          case "$ACTION" in
            "check setup") python -m app.cli check ;;
            "dry run")     if [ -n "$TASK_ID" ]; then python -m app.cli run "$TASK_ID" --dry-run; else python -m app.cli poll --dry-run; fi ;;
            *)             if [ -n "$TASK_ID" ]; then python -m app.cli run "$TASK_ID"; else python -m app.cli poll; fi ;;
          esac
